spring:
  application:
    name: HoneyPushService
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/honeypush}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173
  cookie:
    secure: ${COOKIE_SECURE:false}
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-4o-mini}
